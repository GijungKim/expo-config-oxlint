name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Oxlint ${{ matrix.oxlint-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oxlint-version:
          - 1.79.0
          - 1.89.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false oxlint@${{ matrix.oxlint-version }}
      - run: npm test
        env:
          OXLINT_VERSION: ${{ matrix.oxlint-version }}
